<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="sc-ud">

  <!-- tags -->
  <sc-if value="{{ hasTags }}" hint-placeholder-val="{{ false }}">
    <div class="sc-ud-tags">
      <sc-for list="{{ tags }}" as="tg" hint-placeholder-count="3">
        <button onClick="{{ tg.onOpen }}" class="sc-ud-tag">{{ tg.name }}</button>
      </sc-for>
    </div>
  </sc-if>

  <!-- profile: one strip, health stands out -->
  <div class="sc-ud-stats" style="grid-template-columns:repeat({{ statCols }},minmax(0,1fr))">
    <sc-for list="{{ stats }}" as="stt" hint-placeholder-count="5">
      <div class="{{ stt.cls }}"><small>{{ stt.k }}</small><b>{{ stt.v }}</b></div>
    </sc-for>
  </div>

  <!-- weapons -->
  <sc-if value="{{ hasWeapons }}" hint-placeholder-val="{{ false }}">
    <section class="sc-ud-sec">
      <div class="sc-ud-head"><span>Weapons</span><i></i></div>
      <sc-for list="{{ weapons }}" as="wp" hint-placeholder-count="2">
        <div class="sc-ud-wpn" style="--ph:{{ wp.phFg }}">
          <div class="sc-ud-wpn-top"><b>{{ wp.name }}</b><span class="sc-ud-pill">{{ wp.phase }}</span></div>
          <div class="sc-ud-wpn-main">
            <sc-for list="{{ wp.main }}" as="m" hint-placeholder-count="4"><div><small>{{ m.k }}</small><b>{{ m.v }}</b></div></sc-for>
          </div>
          <div class="sc-ud-wpn-sub"><span>{{ wp.target }}</span><sc-if value="{{ wp.surge }}" hint-placeholder-val="{{ false }}"><span class="sc-ud-surge">{{ wp.surge }}</span></sc-if></div>
          <sc-if value="{{ wp.kwSegs }}" hint-placeholder-val="{{ false }}">
            <div class="sc-ud-wpn-kw"><sc-for list="{{ wp.kwSegs }}" as="sg" hint-placeholder-count="1"><sc-if value="{{ sg.kw }}" hint-placeholder-val="{{ false }}"><span onClick="{{ sg.onOpen }}" class="sc-ud-kw">{{ sg.t }}</span></sc-if><sc-if value="{{ sg.plain }}" hint-placeholder-val="{{ true }}"><span>{{ sg.t }}</span></sc-if></sc-for></div>
          </sc-if>
        </div>
      </sc-for>
      <button onClick="{{ toggleLegend }}" aria-expanded="{{ legendOpen }}" class="sc-ud-legend-btn">{{ legendLabel }}</button>
      <sc-if value="{{ legendOpen }}" hint-placeholder-val="{{ false }}">
        <div class="sc-ud-legend">
          <sc-for list="{{ legend }}" as="lg" hint-placeholder-count="6"><b>{{ lg.k }}</b><span>{{ lg.v }}</span></sc-for>
        </div>
      </sc-if>
    </section>
  </sc-if>

  <!-- abilities, grouped by phase -->
  <sc-if value="{{ hasAbilities }}" hint-placeholder-val="{{ false }}">
    <section class="sc-ud-sec">
      <div class="sc-ud-head"><span>Abilities</span><i></i></div>
      <sc-for list="{{ abilityGroups }}" as="ag" hint-placeholder-count="2">
        <div class="sc-ud-group" style="--ph:{{ ag.phFg }}">
          <span class="sc-ud-pill">{{ ag.phase }}</span>
          <sc-for list="{{ ag.items }}" as="ab" hint-placeholder-count="2">
            <div class="sc-ud-abil">
              <div class="sc-ud-abil-top"><b>{{ ab.name }}</b><span class="{{ ab.typeCls }}">{{ ab.type }}</span></div>
              <div class="sc-def sc-ud-text"><sc-for list="{{ ab.segs }}" as="sg" hint-placeholder-count="1"><sc-if value="{{ sg.kw }}" hint-placeholder-val="{{ false }}"><span onClick="{{ sg.onOpen }}" class="sc-ud-kw">{{ sg.t }}</span></sc-if><sc-if value="{{ sg.plain }}" hint-placeholder-val="{{ true }}"><span>{{ sg.t }}</span></sc-if></sc-for></div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </section>
  </sc-if>

  <!-- upgrades -->
  <sc-if value="{{ hasUpgrades }}" hint-placeholder-val="{{ false }}">
    <section class="sc-ud-sec">
      <div class="sc-ud-head sc-ud-head--gold"><span>Upgrades</span><i></i></div>
      <div style="display:grid;gap:6px">
        <sc-for list="{{ upgrades }}" as="up" hint-placeholder-count="2">
          <div onClick="{{ up.onToggle }}" role="button" style="display:flex;gap:10px;padding:9px 10px;background:{{ up.bg }};border:1px solid {{ up.bd }};cursor:{{ up.cursor }}">
            <sc-if value="{{ up.interactive }}" hint-placeholder-val="{{ false }}">
              <span style="width:18px;height:18px;flex:0 0 auto;margin-top:2px;display:grid;place-items:center;border:1px solid {{ up.boxBd }};background:{{ up.boxBg }}">
                <sc-if value="{{ up.on }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.5L4.8 9 10 3.5" stroke="#0a0c11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
              </span>
            </sc-if>
            <span style="flex:1;min-width:0">
              <span style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">
                <span style="font-family:Rajdhani,sans-serif;font-size:14px;font-weight:700;color:#e9ecf2">{{ up.name }}</span>
                <span style="font-family:Rajdhani,sans-serif;font-size:12px;font-weight:700;color:#f2c14e">{{ up.cost }}</span>
                <span style="font-family:Rajdhani,sans-serif;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:1px 6px;background:{{ up.phBg }};color:{{ up.phFg }}">{{ up.phase }}</span>
              </span>
              <span class="sc-def" style="display:block;font-size:12.5px;color:#9aa1b4;line-height:1.5;margin-top:2px"><sc-for list="{{ up.segs }}" as="sg" hint-placeholder-count="1"><sc-if value="{{ sg.kw }}" hint-placeholder-val="{{ false }}"><span onClick="{{ sg.onOpen }}" class="sc-ud-kw">{{ sg.t }}</span></sc-if><sc-if value="{{ sg.plain }}" hint-placeholder-val="{{ true }}"><span>{{ sg.t }}</span></sc-if></sc-for></span>
            </span>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 400, &quot;height&quot;: 500}, &quot;detail&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;, &quot;default&quot;: null}}">
class Component extends DCLogic {
  state = { legend: false };
  renderVals() {
    const d = this.props.detail || {};
    const stats = d.stats || [];
    const upgrades = (d.upgrades || []).map(u => ({
      ...u,
      cursor: u.interactive ? 'pointer' : 'default',
      bg: u.on ? 'var(--fc-bg-10, rgba(147,51,234,0.1))' : '#171b28',
      bd: u.on ? 'var(--fc-primary-45, rgba(176,110,247,0.45))' : '#232939',
      boxBd: u.on ? 'var(--fc-primary-solid, #b06ef7)' : '#3a4154',
      boxBg: u.on ? 'var(--fc-primary-solid, #b06ef7)' : 'transparent',
      onToggle: u.interactive ? u.onToggle : null
    }));
    // Health and shields read first in the profile strip.
    const statCls = { HP: ' sc-ud-stat--hp', SHD: ' sc-ud-stat--shd' };
    // Weapons: the four numbers you roll with in big type; target and surge as a plain line.
    const weapons = (d.weapons || []).map(w => {
      const m = {}; (w.chips || []).forEach(c => { m[c.k] = c.v; });
      const has = v => v && v !== '-' && v !== '—';
      const rng = m.RNG === 'E' ? 'Melee' : /^\d+$/.test(m.RNG || '') ? m.RNG + '"' : (m.RNG || '-');
      return { ...w,
        main: [{ k: 'Range', v: rng }, { k: 'Attacks', v: m.RoA || '-' }, { k: 'Hit', v: m.HIT || '-' }, { k: 'Damage', v: m.DMG || '-' }],
        target: 'Targets ' + (m.TGT || '-'),
        surge: has(m.SURGE) ? 'Surge vs ' + m.SURGE + (has(m['S.DIE']) ? ' · ' + m['S.DIE'] : '') : '' };
    });
    const abilityGroups = (d.abilityGroups || []).map(g => ({ ...g,
      items: (g.items || []).map(a => ({ ...a, typeCls: 'sc-ud-type' + (/^active/i.test(a.type || '') ? ' sc-ud-type--active' : /reaction/i.test(a.type || '') ? ' sc-ud-type--reaction' : '') })) }));
    return {
      tags: d.tags || [],
      hasTags: (d.tags || []).length > 0,
      stats: stats.map(x => ({ ...x, cls: 'sc-ud-stat' + (statCls[x.k] || '') })),
      statCols: Math.max(stats.length, 1),
      weapons,
      hasWeapons: weapons.length > 0,
      abilityGroups, hasAbilities: abilityGroups.length > 0,
      upgrades,
      hasUpgrades: upgrades.length > 0,
      legendOpen: this.state.legend,
      legendLabel: this.state.legend ? 'Hide abbreviations' : 'What do SPD, RoA, S.DIE mean?',
      toggleLegend: (ev) => { if (ev) ev.stopPropagation(); this.setState(s => ({ legend: !s.legend })); },
      legend: [
        { k: 'SPD', v: 'Speed: how far the Leading Model moves, in inches' },
        { k: 'EVD', v: 'Evade: defensive roll, when the Unit is eligible' },
        { k: 'ARM', v: 'Armour: defensive roll against hits' },
        { k: 'SHD', v: 'Shield points' },
        { k: 'HP', v: 'Hit points per model' },
        { k: 'SIZE', v: 'Model size' },
        { k: 'RNG', v: 'Range in inches; E means Engagement Range (melee)' },
        { k: 'TGT', v: 'What the weapon can target (Ground, Air, All)' },
        { k: 'RoA', v: 'Rate of Attack: dice each model adds to the Attack Pool' },
        { k: 'HIT', v: 'Roll needed to hit' },
        { k: 'SURGE', v: 'Combat Tag on the target that triggers Surge' },
        { k: 'S.DIE', v: 'Surge Die added to the attack' },
        { k: 'DMG', v: 'Damage per successful hit' },
        { k: 'BM / CP / PE', v: 'Biomass (Zerg), Command Points (Terran), Psionic Energy (Protoss): paid by exhausting cards' }
      ]
    };
  }
}

</script>
</body>
</html>
