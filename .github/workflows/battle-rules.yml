name: Battle rules reference checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original miniature JPEGs when not yet tracked
        run: |
          if [ ! -f portraits/pdf/terran/marine.jpg ]; then
            python -m pip install --quiet PyMuPDF==1.26.5
            python scripts/extract-pdf-miniatures.py
          fi
      - name: Validate all 22 source photographs
        run: python scripts/extract-pdf-miniatures.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate battle reference and faction data
        run: npm run test:rules
      - name: Verify October 2026 faction points, compositions and upgrades
        run: npm run test:appendix
      - name: Verify actual Wave 3 companion and army screens
        run: npm run test:wave3
      - name: Verify miniature picture sources and local fallbacks
        run: npm run test:portraits
      - name: Verify compact scroll resource header on faction screens
        run: npm run test:resource-header
      - name: Verify Battle card abilities and resource payment tracking
        run: npm run test:battle-energy
      - name: Verify Tactical and Troops battle summary modals
        run: npm run test:battle-dashboard
      - name: Verify merged army tabs and engagement size selection
        run: npm run test:unified-army
      - name: Verify Codex example explanations and modal navigation
        run: npm run test:codex-examples
      - name: Verify mission score suggestions
        run: npm run test:scoring
      - name: Verify reopening resumes the last screen
        run: npm run test:resume
      - name: Check committed NotebookLM study sources
        run: npm run test:study
      - name: Check faction data generator output
        run: npm run build:units
      - name: Ensure generated data is committed consistently
        run: git diff --exit-code -- terran-data.js zerg-data.js protoss-data.js
      - name: Submit original JPEGs for GitHub review on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git ls-files --error-unmatch portraits/pdf/terran/marine.jpg >/dev/null 2>&1; then
            echo 'PDF miniature JPEGs are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c generated/pdf-wave1-miniatures-2026
          git add portraits/pdf
          git commit -m 'Include exact miniature photos from credited 2026 publisher PDF'
          git push -u origin HEAD:generated/pdf-wave1-miniatures-2026
