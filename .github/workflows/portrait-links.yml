name: Remote portrait links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
  pull_request:
    paths:
      - model-portraits.js
      - scripts/check-remote-portraits.mjs

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check publisher-hosted miniature photos still load
        run: node scripts/check-remote-portraits.mjs
