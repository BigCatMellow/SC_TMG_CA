name: Bug report
description: Something in the app looks wrong or doesn't work
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Screen and tab, e.g. "Zerg › Library" or "VS".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Steps to get there help a lot. Screenshots are welcome.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: e.g. "Pixel 8, Chrome" or "Windows, Firefox".
